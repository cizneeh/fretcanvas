name: Dependabot Auto-merge

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    name: Enable auto-merge
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'cizneeh/fretcanvas'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Read Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}

      - name: Enable auto-merge for npm patch and minor updates
        if: >-
          steps.metadata.outputs.package-ecosystem == 'npm' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"

      - name: Leave major and GitHub Actions updates for manual review
        if: >-
          steps.metadata.outputs.package-ecosystem != 'npm' ||
          steps.metadata.outputs.update-type == 'version-update:semver-major'
        env:
          PACKAGE_ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          echo "Auto-merge was not enabled." >> "$GITHUB_STEP_SUMMARY"
          echo "Package ecosystem: $PACKAGE_ECOSYSTEM" >> "$GITHUB_STEP_SUMMARY"
          echo "Update type: $UPDATE_TYPE" >> "$GITHUB_STEP_SUMMARY"
